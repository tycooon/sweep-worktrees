name: CI

on: [push, pull_request]

jobs:
  test:
    # Internal PRs already run on the push event.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != 'tycooon/sweep-worktrees'

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        ruby: ["3.3", "3.4", "4.0"]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.ruby }}

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake
